
name: Import Wish Slots Starter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract starter ZIP
        run: |
          unzip -o wish-slots-gaming-platform-starter.zip -d /tmp/import
          cp -R /tmp/import/wish-slots-gaming-platform/. .
          rm wish-slots-gaming-platform-starter.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Wish Slots starter project" || echo "No changes"
          git push
          
